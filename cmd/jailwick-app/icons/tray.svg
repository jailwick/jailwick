<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <!-- jailwick menu bar icon: a template image, macOS tints it for light and dark menu bars -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="44" height="44">
      <rect width="44" height="44" fill="#fff"/>
      <rect x="18.125" y="0" width="1.1" height="44" fill="#000"/>
      <rect x="24.775" y="0" width="1.1" height="44" fill="#000"/>
      <rect x="9.65" y="0" width="4.75" height="44" fill="#000"/>
      <rect x="29.6" y="0" width="4.75" height="44" fill="#000"/>
    </mask>
    <mask id="clear" maskUnits="userSpaceOnUse" x="0" y="0" width="44" height="44">
      <rect width="44" height="44" fill="#fff"/>
      <circle cx="22" cy="22.5" r="10.25" fill="#000"/>
    </mask>
  </defs>
  <circle cx="22" cy="22.5" r="8.5" mask="url(#cut)"/>
  <rect x="10.9" y="12" width="2.25" height="21"/>
  <rect x="30.85" y="12" width="2.25" height="21"/>
  <g mask="url(#clear)">
    <rect x="17.55" y="12" width="2.25" height="21"/>
    <rect x="24.2" y="12" width="2.25" height="21"/>
  </g>
  <rect x="4.75" y="10.75" width="34.5" height="23.5" rx="6" fill="none" stroke="#000" stroke-width="3.5"/>
</svg>
